services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: school-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Change_this_Strong_Password123!"
    ports:
      - "1433:1433"
    volumes:
      - school_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Change_this_Strong_Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SchoolManagementDb;User Id=sa;Password=Change_this_Strong_Password123!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "REPLACE_WITH_A_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS_LONG"
      Jwt__Issuer: "SchoolManagementSystem"
      Jwt__Audience: "SchoolManagementSystemClient"
      Jwt__ExpiresMinutes: "60"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  school_sql_data:
